name: Promote release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Immutable image tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ inputs.image_tag }}
      - name: Verify image health
        run: |
          docker run -d --rm --name fleetiq-smoke -p 8000:8000 \
            -e ENVIRONMENT=staging \
            ghcr.io/${{ github.repository }}/api:${{ inputs.image_tag }}
          trap 'docker logs fleetiq-smoke || true; docker stop fleetiq-smoke || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 2
          done
          exit 1
      - name: Rollback guidance
        if: failure()
        run: |
          echo "::error::Promotion failed. Re-deploy the last known-good immutable image tag."
          echo "Rollback command: gh workflow run promote.yml -f environment=${{ inputs.environment }} -f image_tag=<known-good-tag>"
